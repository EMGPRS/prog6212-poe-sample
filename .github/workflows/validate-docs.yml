name: Validate Documentation Files

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/validate-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/validate-docs.yml'

jobs:
  required-documentation-files:
    name: Check required documentation formats
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files exist in docs
        shell: bash
        run: |
          set -euo pipefail

          required_extensions=(sql pdf)
          optional_extensions=(md png)
          missing_files=()

          for extension in "${required_extensions[@]}"; do
            if ! find docs -type f -iname "*.${extension}" -print -quit | grep -q .; then
              missing_files+=("docs/**/*.${extension}")
            fi
          done

          if [ "${#missing_files[@]}" -gt 0 ]; then
            echo "Missing required file(s): ${missing_files[*]}"
            exit 1
          fi

          echo "docs/ contains the required .sql and .pdf files."

          for extension in "${optional_extensions[@]}"; do
            if find docs -type f -iname "*.${extension}" -print -quit | grep -q .; then
              echo "Optional .${extension} file found in docs/."
            else
              echo "Optional .${extension} file not found in docs/."
            fi
          done